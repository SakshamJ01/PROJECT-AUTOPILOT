[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot"
version = "0.1.0"
description = "PROJECT AUTOPILOT Phase 0 / M0 — local-first autonomous content production skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "python-dotenv>=1.2.3",
    "edge-tts>=7.2.8",
    "pillow>=12.3.0",
    "open-clip-torch>=3.3.0",
    "faster-whisper>=1.0.0",
    "kokoro-onnx>=0.4.0",
    "tzdata>=2024.1",
    "crawl4ai>=0.4.0",
]

[project.scripts]
autopilot = "autopilot.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autopilot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not live'"
markers = [
    "live: opt-in live network integration tests (excluded by default)",
    "use_real_provider_credentials: opt in to real provider credentials from .env",
]

[tool.ruff.lint]
# Error-class rules only: syntax errors, statement bugs, and undefined names.
# This is the class of bug that shipped as a live NameError in the CLI
# (`autopilot batch` crashed on `sub_parser_batch`). Full style lint (F401
# unused-imports etc.) is deferred to a separate cleanup.
select = ["E9", "F63", "F7", "F82", "F821"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "mypy>=2.3.1",
    "ruff>=0.14",
]
